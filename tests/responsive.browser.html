<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Drug Tracker responsive verification</title>
<style>
body{margin:0;font:14px system-ui;background:#dde1e6;color:#17212d}header{position:sticky;top:0;left:0;background:white;padding:12px;z-index:2;max-width:100vw;box-sizing:border-box}p{margin:6px 0}button{min-height:40px;border:1px solid #bcc4ce;background:white;border-radius:5px;padding:8px;margin:3px}button[aria-pressed=true]{background:#1d426d;color:white}#stage{padding:12px;width:max-content}iframe{display:block;border:1px solid #a5aeb9;background:white;height:950px;width:390px}#engine{font-size:11px;overflow-wrap:anywhere}output{display:block;margin:6px 0}
</style></head><body><header><strong>Responsive verification · synthetic database</strong><div id="sizes"></div><div id="pages"></div><button id="text-size" aria-pressed="false">200% text</button><button id="measure">Check layout</button><output id="result">390 px</output><p id="engine"></p></header><div id="stage"><iframe title="Medication tracker test" src="./responsive-app.html"></iframe></div><script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result');
let largeText=false;
for(const width of [320,375,390,393,768,1024,1440]){const button=document.createElement('button');button.textContent=`${width} px`;button.ariaPressed=String(width===390);button.onclick=()=>{frame.style.width=`${width}px`;document.querySelectorAll('#sizes button').forEach(b=>b.ariaPressed=String(b===button));result.textContent=`${width} px`;};document.querySelector('#sizes').append(button);}
for(const page of ['Dose Simulation','History','Settings']){const b=document.createElement('button');b.textContent=page;b.onclick=()=>{const btn=[...frame.contentDocument.querySelectorAll('nav button')].find(el=>el.textContent===page);btn?.click();};document.querySelector('#pages').append(b);}
document.querySelector('#engine').textContent=navigator.userAgent;
document.querySelector('#text-size').onclick=()=>{largeText=!largeText;document.querySelector('#text-size').ariaPressed=String(largeText);const doc=frame.contentDocument;const elements=[...doc.querySelectorAll('body *')];if(largeText){const baseline=elements.map(el=>[el,parseFloat(frame.contentWindow.getComputedStyle(el).fontSize)]);for(const [el,size] of baseline){el.dataset.qaFont=el.style.fontSize;el.style.fontSize=`${size*2}px`;}}else{for(const el of elements){if(el.dataset.qaFont!==undefined){el.style.fontSize=el.dataset.qaFont;delete el.dataset.qaFont;}}}};
document.querySelector('#measure').onclick=()=>{const doc=frame.contentDocument,w=frame.contentWindow.innerWidth;const issues=[];for(const el of doc.querySelectorAll('main input,main select,main button,nav button')){if(el.closest('details:not([open])')||el.closest('.table-wrap'))continue;const r=el.getBoundingClientRect();if(r.width&&r.height&&(r.left < -1||r.right>w+1))issues.push(el.getAttribute('aria-label')||el.textContent.trim());}result.textContent=`${doc.querySelector('h1')?.textContent}: Viewport ${w}px; page ${doc.documentElement.scrollWidth}px; overflow controls: ${issues.length?issues.join(', '):'none'}`;};
</script></body></html>
